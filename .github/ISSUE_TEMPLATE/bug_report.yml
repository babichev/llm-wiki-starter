name: Сообщить об ошибке
description: Воспроизводимая ошибка в шаблоне, инструкции или скрипте
title: '[Ошибка] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Используй вымышленные данные. Не загружай личную базу, переписку, ключи и полный необработанный лог. Об уязвимостях сообщай по SECURITY.md.'
  - type: input
    id: version
    attributes:
      label: Версия комплекта
      placeholder: Например, 1.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Где возникла ошибка
      description: ОС, приложение и версия Python, если ошибка в скрипте. Без личных путей и аккаунтов.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Короткие шаги с вымышленным примером.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ожидаемый и фактический результат
      description: Что должно было произойти и что произошло. Удали секреты из текста ошибки.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед отправкой
      options:
        - label: В сообщении и вложениях нет личной базы, чужих данных или действующих секретов.
          required: true
